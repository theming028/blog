# 兜底 server 块：凡 Host 不是已备案域名的请求（直接敲 IP、扫段、错域）一律 444 断开。
#
# 为什么要它：阿里云要求首次备案期间网站处于关闭状态。域名侧本来就被拦，
# 但按 IP 仍能打开站点，等于"网站在线"，初审有被挑出来的风险。
# 下号、切到 HTTPS 版之后可以删掉这个文件（443 那段可保留，它同时挡掉拿 IP 走 HTTPS 的探测）。
#
# 精确 server_name 优先于 default_server，所以不会影响 shaoym.me 自己的匹配块。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# 证书还没签发时也不能让这个默认块引用证书，否则 nginx -t 直接失败。
# ssl_reject_handshake 在 TLS 握手阶段就断开，无需任何证书。
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}
