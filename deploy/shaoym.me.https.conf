# 阶段二：证书签发后启用。HTTP 只做 ACME 与跳转，其余 301 到 HTTPS。
# 注意 X-Forwarded-Proto 必须是 https —— 应用据此给会话 cookie 加 Secure。
server {
    listen 80;
    listen [::]:80;
    server_name shaoym.me www.shaoym.me;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shaoym.me www.shaoym.me;

    ssl_certificate     /etc/letsencrypt/live/shaoym.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shaoym.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    access_log /var/log/nginx/shaoym.me.access.log;
    error_log  /var/log/nginx/shaoym.me.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 牧羊小勇士（移动端 H5）：与潜艇大战同样由 nginx 直发，不经 Node，
    # 避开应用 CSP 对内联脚本的限制
    location = /shepherd { return 301 /shepherd/; }
    location /shepherd/ {
        alias /var/www/games/shepherd/;
        index index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
