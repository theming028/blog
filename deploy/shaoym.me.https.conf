# 阶段二：证书签发后启用。HTTP 只做 ACME 与跳转，其余 301 到 HTTPS。
# 注意 X-Forwarded-Proto 必须是 https —— 应用据此给会话 cookie 加 Secure。

# 复用到 Node 的上游连接：不开 keepalive 时每个请求都要重新握手一次本地 TCP，
# 单核机器上纯属白付开销（尤其图片这类多请求资源）。
upstream blogapp {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name shaoym.me www.shaoym.me;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shaoym.me www.shaoym.me;

    ssl_certificate     /etc/letsencrypt/live/shaoym.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shaoym.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 跨境链路 RTT 约 400ms：客户端每新建一条连接就要多付一次 TCP+TLS 握手（≈1.2s），
    # 所以要把连接留得住——尤其对走 HTTP/1.1 的客户端（浏览器对同域最多 6 条并发）。
    keepalive_timeout   75s;
    keepalive_requests  1000;

    client_max_body_size 20m;

    access_log /var/log/nginx/shaoym.me.access.log;
    error_log  /var/log/nginx/shaoym.me.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location / {
        proxy_pass http://blogapp;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
