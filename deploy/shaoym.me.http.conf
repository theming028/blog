# 阶段一：仅 HTTP。用于首次签发证书前的可达性与 ACME 校验。
# 应用自己下发 CSP/X-Frame-Options 等安全头，这里不再重复设置。
server {
    listen 80;
    listen [::]:80;
    server_name shaoym.me www.shaoym.me;

    # 应用侧 readBody 上限 20MB；Nginx 默认 1MB 会让图片上传直接 413
    client_max_body_size 20m;

    access_log /var/log/nginx/shaoym.me.access.log;
    error_log  /var/log/nginx/shaoym.me.error.log;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
