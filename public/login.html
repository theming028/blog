<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 朝夕光年后台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="adm-login">
  <div class="adm-login-card">
    <div class="adm-login-brand">
      <!-- logo 即前台入口：新窗口打开。登录页不加载 common.js，纯 <a> 不依赖任何脚本 -->
      <a class="logo" href="/" target="_blank" rel="noopener" title="打开前台（新窗口）">朝</a>
      <h2>朝夕光年 · 管理后台</h2>
      <p>Ming 的光影年华</p>
    </div>
    <div class="adm-field">
      <label>用户名</label>
      <input class="adm-input" id="lUser" type="text" autocomplete="username" placeholder="请输入用户名">
    </div>
    <div class="adm-field">
      <label>密码</label>
      <input class="adm-input" id="lPass" type="password" autocomplete="current-password" placeholder="请输入密码">
    </div>
    <button class="adm-login-btn" id="lBtn">登 录</button>
    <div class="adm-login-err" id="lErr"></div>
  </div>
</div>

<script src="/js/login.js"></script>
</body>
</html>
