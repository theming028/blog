<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内容管理 · 朝夕光年后台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="adm">

  <!-- 侧边栏 -->
  <aside class="adm-side" id="side">
    <div class="adm-brand"><b>朝夕光年</b><small>Ming 的光影年华 · 管理后台</small></div>
    <nav class="adm-nav">
      <div class="adm-nav-label">内容</div>
      <button class="adm-nav-item active" data-view="content">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>内容管理
      </button>
      <button class="adm-nav-item" data-view="comments">
        <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.9 2 11.7c0 2.7 1.4 5.1 3.7 6.7-.2 1-.8 2.2-1.6 3 1.7-.2 3.3-.9 4.4-1.7 1.1.3 2.3.5 3.5.5 5.5 0 10-3.9 10-8.5S17.5 3 12 3z"/></svg>
        <span>评论管理</span><span class="adm-nav-badge" id="navCmtBadge" style="display:none"></span>
      </button>
      <button class="adm-nav-item" data-view="visits">
        <svg viewBox="0 0 24 24"><path d="M12 5c-4.4 0-8.2 2.7-9.5 6C3.8 14.3 7.6 17 12 17s8.2-2.7 9.5-6C20.2 7.7 16.4 5 12 5zm0 9.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2zm0-5.2a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2z"/></svg>
        <span>访客记录</span><span class="adm-nav-badge" id="navVisitBadge" style="display:none"></span>
      </button>
      <button class="adm-nav-item" data-view="links">
        <svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l1.4-1.4a1 1 0 0 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zM8.5 15.5 7 17a3 3 0 0 0 4.2 4.2l1.5-1.5m2.8-8.2L19 7a3 3 0 1 0-4.2-4.2l-1.5 1.5"/></svg>
        网上邻居
      </button>
      <div class="adm-nav-label">站点</div>
      <!-- 签名 / 封面图 / 头像 / 昵称 四件事合并成这一个视图：
           原先"签名管理"和"外观设置"各自开一个弹窗，改一处要点两次、看两个保存键 -->
      <button class="adm-nav-item" data-view="settings">
        <svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7zm0 2.3 6.5 3.6L12 13 5.5 9.5zM5 11.2l6 3.3v5.6l-6-3.3zm14 0v5.6l-6 3.3v-5.6z"/></svg>设置
      </button>
    </nav>
    <div class="adm-side-foot">
      <button class="adm-nav-item" id="btnLogout">
        <svg viewBox="0 0 24 24"><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h5v-2H5V5h5zm7.6 4.6L16.2 6.2 20 10h-8v2h8l-3.8 3.8 1.4 1.4L22 12z"/></svg>退出登录
      </button>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="adm-main">
    <header class="adm-top">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="adm-menu-btn" id="btnMenu"><svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
        <h1 id="pageTitle">内容管理</h1>
      </div>
      <div class="adm-top-actions">
        <a class="adm-btn" href="/" target="_blank"><svg viewBox="0 0 24 24"><path d="M14 3v2h3.6l-9.3 9.3 1.4 1.4L19 8.4V12h2V3z"/><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7h-2z"/></svg>前台</a>
        <a class="adm-btn primary" href="/edit"><svg viewBox="0 0 24 24"><path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"/></svg>新建内容</a>
      </div>
    </header>

    <div class="adm-body">
      <!-- 内容管理视图 -->
      <section class="adm-view" id="viewContent">
        <section class="adm-stats" id="admStats"></section>
        <section class="adm-panel">
          <div class="adm-panel-head"><div><b>全部内容</b><span class="sub" id="admCount"></span></div></div>
          <table class="adm-table">
            <thead><tr>
              <th>内容</th><th class="hide-sm">图片</th><th class="hide-sm">发布时间</th>
              <th>状态</th><th class="hide-sm">互动</th><th style="text-align:right">操作</th>
            </tr></thead>
            <tbody id="admTbody"><tr><td colspan="6"><div class="adm-empty">加载中…</div></td></tr></tbody>
          </table>
        </section>
      </section>

      <!-- 评论管理视图 -->
      <section class="adm-view" id="viewComments" hidden>
        <section class="adm-stats" id="cmtStats"></section>
        <section class="adm-panel">
          <div class="adm-panel-head">
            <div><b>评论管理</b><span class="sub" id="cmtCount"></span></div>
            <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
              <div class="adm-tabs" id="cmtFilter">
                <button class="adm-tab active" data-status="all">全部</button>
                <button class="adm-tab" data-status="pending">待审核</button>
                <button class="adm-tab" data-status="visible">已显示</button>
              </div>
              <button class="adm-btn danger" id="btnCmtBatchDel" style="display:none">批量删除 (<span id="cmtSelCount">0</span>)</button>
            </div>
          </div>
          <table class="adm-table">
            <thead><tr>
              <th class="chk-col"><input type="checkbox" id="cmtCheckAll"></th>
              <th>评论内容</th><th>作者</th><th class="hide-sm">所属内容</th>
              <th class="hide-sm">时间</th><th>状态</th><th style="text-align:right">操作</th>
            </tr></thead>
            <tbody id="cmtTbody"><tr><td colspan="7"><div class="adm-empty">加载中…</div></td></tr></tbody>
          </table>
        </section>
      </section>

      <!-- 访客记录视图 -->
      <section class="adm-view" id="viewVisits" hidden>
        <section class="adm-stats" id="visitStats"></section>
        <section class="adm-panel">
          <div class="adm-panel-head adm-visit-head">
            <div><b>访客记录</b><span class="sub" id="visitCount"></span></div>
            <div class="adm-visit-tools">
              <div class="adm-tabs" id="visitRange">
                <button class="adm-tab active" data-range="today">今天</button>
                <button class="adm-tab" data-range="7d">近 7 天</button>
                <button class="adm-tab" data-range="30d">近 30 天</button>
                <button class="adm-tab" data-range="all">全部</button>
              </div>
              <input class="adm-input adm-visit-q" id="visitQ" type="search" maxlength="40" placeholder="搜 IP / 地区 / 设备">
              <label class="adm-check"><input type="checkbox" id="visitHideAdmin"> 隐藏我自己</label>
              <button class="adm-btn danger" id="btnVisitBatchDel" style="display:none">批量删除 (<span id="visitSelCount">0</span>)</button>
            </div>
          </div>
          <table class="adm-table adm-visit-table">
            <!-- 必须 table-layout:fixed + colgroup 钉死列宽：展开行里的 UA / 动作明细都是不换行长文本，
                 自动布局会把整张表的 min-content 撑宽，超出面板后被 .adm-panel 的 overflow:hidden 裁掉，
                 症状是"明细列凭空消失"、看着像没渲染。超长内容一律省略号，完整值挂 title。
                 列宽按 .adm-body 的 min-width:900px 排（可用宽 ~852px），7 列各留到 90–150px。 -->
            <colgroup>
              <col class="c-chk"><col class="c-geo"><col class="c-dev"><col class="c-time2">
              <col class="c-dur"><col class="c-acts"><col class="c-op">
            </colgroup>
            <thead><tr>
              <th class="chk-col"><input type="checkbox" id="visitCheckAll"></th>
              <th>IP · 地区</th><th>设备 / 浏览器</th><th class="hide-sm">进入时间</th>
              <th>停留时长</th><th class="hide-sm">行为</th><th style="text-align:right">明细</th>
            </tr></thead>
            <tbody id="visitTbody"><tr><td colspan="7"><div class="adm-empty">加载中…</div></td></tr></tbody>
          </table>
          <div class="adm-foot" id="visitPager"></div>
        </section>
        <!-- 留存与隐私口径写在页面上，而不是只写在 README 里：
             看这个页面的人需要立刻知道"存了什么、存多久、怎么清" -->
        <p class="adm-note" id="visitNote"></p>
      </section>

      <!-- 网上邻居视图 -->
      <section class="adm-view" id="viewLinks" hidden>
        <section class="adm-panel">
          <div class="adm-panel-head">
            <div><b>网上邻居</b><span class="sub" id="linkCount"></span></div>
            <button class="adm-btn primary" id="btnNewLink"><svg viewBox="0 0 24 24"><path d="M12 4a1 1 0 0 1 1 1v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5a1 1 0 0 1 1-1z"/></svg>新建链接</button>
          </div>
          <table class="adm-table">
            <thead><tr>
              <th>名称</th><th>链接</th><th class="hide-sm">描述</th><th class="hide-sm">排序</th><th style="text-align:right">操作</th>
            </tr></thead>
            <tbody id="linkTbody"><tr><td colspan="5"><div class="adm-empty">加载中…</div></td></tr></tbody>
          </table>
        </section>
      </section>

      <!-- 设置视图：签名 + 封面图 + 头像 + 昵称，一个表单、一个保存键 -->
      <section class="adm-view" id="viewSettings" hidden>
        <div class="adm-form">
          <div class="set-pick-row">
            <div class="set-pick"><label>封面图 <span class="hint">换图后需保存</span></label><div class="set-box" id="pickCover"><img id="pickCoverImg" alt=""><span class="badge">更换</span></div></div>
            <div class="set-pick"><label>头像 <span class="hint">换图后需保存</span></label><div class="set-box" id="pickAvatar"><img id="pickAvatarImg" alt=""><span class="badge">更换</span></div></div>
          </div>
          <div class="adm-field">
            <label>昵称</label>
            <input class="adm-input" id="setNickInput" type="text" maxlength="20" placeholder="显示在封面与前台昵称">
          </div>
          <div class="adm-field">
            <label>封面签名 <span class="hint">留空则不显示</span></label>
            <input class="adm-input" id="signInput" type="text" maxlength="40" placeholder="显示在封面昵称下方">
          </div>
          <div class="adm-field">
            <label class="adm-switch"><input type="checkbox" id="setSnow"> 飘雪 <span class="hint">前台页面的大雪微风特效；关掉时不创建画布、零开销</span></label>
          </div>
          <div class="adm-form-actions"><button class="adm-btn primary" id="btnSetSave">保存设置</button></div>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- 新建/编辑链接弹窗 -->
<div class="adm-mask" id="dlgLink">
  <div class="adm-modal">
    <div class="adm-modal-head" id="linkModalTitle">新建链接</div>
    <div class="adm-modal-body">
      <div class="adm-field"><label>名称</label><input class="adm-input" id="linkName" type="text" maxlength="30" placeholder="站点名称"></div>
      <div class="adm-field"><label>链接地址</label><input class="adm-input" id="linkUrl" type="text" placeholder="https://"></div>
      <div class="adm-field"><label>描述 <span class="hint">选填</span></label><input class="adm-input" id="linkDescr" type="text" maxlength="40"></div>
      <div class="adm-field" style="margin-bottom:0"><label>排序 <span class="hint">数字越小越靠前</span></label><input class="adm-input" id="linkSort" type="number" value="0"></div>
    </div>
    <div class="adm-modal-foot"><button class="adm-btn" id="dlgLinkCancel">取消</button><button class="adm-btn primary" id="dlgLinkOk">保存</button></div>
  </div>
</div>

<!-- 确认弹窗 -->
<div class="adm-mask" id="dlgConfirm">
  <div class="adm-modal" style="width:360px">
    <div class="adm-modal-body"><div class="adm-modal-msg" id="dlgConfirmMsg"></div></div>
    <div class="adm-modal-foot"><button class="adm-btn" id="dlgConfirmCancel">取消</button><button class="adm-btn primary" id="dlgConfirmOk">确定</button></div>
  </div>
</div>
<!-- 提示弹窗 -->
<div class="adm-mask" id="dlgAlert">
  <div class="adm-modal" style="width:340px">
    <div class="adm-modal-body"><div class="adm-modal-msg" id="dlgAlertMsg"></div></div>
    <div class="adm-modal-foot"><button class="adm-btn primary" id="dlgAlertOk">好</button></div>
  </div>
</div>

<input type="file" id="fileCover" accept="image/jpeg,image/png,image/webp" style="display:none">
<input type="file" id="fileAvatar" accept="image/jpeg,image/png,image/webp" style="display:none">

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
